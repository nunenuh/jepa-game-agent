[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jepa-game-agent"
version = "0.1.0"
description = "A JEPA agent that lives inside a game world: predicts, remembers, picks goals, acts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lalu Erfandi Maula Yusnu", email = "nunenuh@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
]

[project.optional-dependencies]
craftax = ["craftax>=1.6", "jax>=0.4.30"]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.3",
]

[project.scripts]
jga = "jepa_game_agent.cli:main"

[project.urls]
Repository = "https://github.com/nunenuh/jepa-game-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_game_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["jepa_game_agent"]

[[tool.mypy.overrides]]
module = ["craftax.*", "jax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=jepa_game_agent --cov-report=term-missing --cov-fail-under=80"
markers = ["craftax: needs the optional craftax extra (skipped when it isn't installed)"]

[tool.coverage.run]
omit = [  # need the craftax extra: tested in the craftax CI job
    "src/jepa_game_agent/envs/craftax.py",
    "src/jepa_game_agent/data/craftax_batch.py",
    "src/jepa_game_agent/policies/mlp.py",
    "src/jepa_game_agent/evaluation/craftax_batch_eval.py",
]
